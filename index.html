<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama - PPLG</title>
    <style>
        /* Mengatur tampilan dasar (tema gelap mirip chat) */
        body {
            font-family: Arial, sans-serif;
            /* Latar belakang gelap, Anda bisa menggantinya dengan gambar pola/doodle jika punya */
            background-color: #0f1115; 
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Kotak pembungkus utama untuk tampilan HP (Mobile First) */
        .container {
            width: 100%;
            max-width: 400px;
        }

        /* Gaya untuk pesan header "Pilih menu di bawah:" */
        .header-chat {
            background-color: #1e2329;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .header-chat .time {
            font-size: 12px;
            color: #8b939c;
        }

        /* Daftar menu */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px; /* Jarak antar tombol */
        }

        /* Gaya untuk setiap tombol menu */
        .menu-item {
            background-color: #1a1e24; /* Warna abu-abu gelap */
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2c323a; /* Garis tepi tipis */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s;
        }

        /* Efek saat tombol disentuh atau diklik */
        .menu-item:hover, .menu-item:active {
            background-color: #2c323a;
        }

        /* Memberi jarak antara ikon emoji dan teks */
        .menu-item span {
            margin-right: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header Mirip Chat Telegram/WA -->
        <div class="header-chat">
            <span>Pilih menu di bawah</span>
            <span class="time">04:41</span>
        </div>

        <!-- Daftar Tombol Menu -->
        <div class="menu-list">

            <h1>TEST HALAMAN INDEX</h1>
            <!-- Ganti tanda # dengan link file html atau link tujuan Bapak -->
            <a href="form_biodata.html" class="menu-item"><span>📊</span> Form Biodata</a>
            <a href="hasil_biodata.html" class="menu-item"><span>📋</span> Hasil Biodata</a>
            <a href="tabel.html" class="menu-item"><span>🔎</span> Tabel</a>
            <!--<a href="#" class="menu-item"><span>🚩</span> Cek Kecurigaan Hari Ini</a>
            <a href="#" class="menu-item"><span>📍</span> Kunci Lokasi PKL</a>
            <a href="#" class="menu-item"><span>📊</span> Cek Kehadiran Bimbingan PKL</a>
            <a href="#" class="menu-item"><span>📋</span> Pending Approval PKL</a>
            <a href="#" class="menu-item"><span>📔</span> Cek Jurnal Bimbingan PKL</a>-->
            
            <!-- Contoh jika menu ini mengarah ke file atau web lain -->
            <a href="http://www.bagusjava.com/" class="menu-item"><span>🌐</span> Ke Web</a>
        </div>

    </div>

</body>
</html>
